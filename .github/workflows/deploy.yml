name: Deploy Evidence dashboard

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: evidence-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy dashboard
    runs-on: ubuntu-latest
    env:
      DBT_TARGET: prod
      EVIDENCE_SOURCE__oss_pulse__token: ${{ secrets.MOTHERDUCK_TOKEN }}
      EVIDENCE_SOURCE__oss_pulse__database: ${{ secrets.MOTHERDUCK_DATABASE }}
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Build Evidence site
        working-directory: dashboard
        run: npm run build

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dashboard/build --project-name=oss-pulse-dashboard --branch=main

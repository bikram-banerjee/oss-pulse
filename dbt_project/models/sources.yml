version: 2

sources:
  - name: raw
    description: Raw, validated data in the partitioned Parquet lake.
    schema: main
    tables:
      - name: gh_events
        description: Selected GitHub events, partitioned by UTC date and hour.
        meta:
          external_location: >-
            {% if target.name == 'prod' %}
            read_parquet('s3://{{ env_var("R2_BUCKET") }}/raw/gh_events/**/*.parquet',
            hive_partitioning = true, union_by_name = true)
            {% else %}
            read_parquet('{{ env_var("LAKE_ROOT", "data/lake") }}/raw/gh_events/**/*.parquet',
            hive_partitioning = true, union_by_name = true)
            {% endif %}
      - name: hn_stories
        description: Hacker News stories, partitioned by UTC date.
        meta:
          external_location: >-
            {% if target.name == 'prod' %}
            read_parquet('s3://{{ env_var("R2_BUCKET") }}/raw/hn_stories/**/*.parquet',
            hive_partitioning = true, union_by_name = true)
            {% else %}
            read_parquet('{{ env_var("LAKE_ROOT", "data/lake") }}/raw/hn_stories/**/*.parquet',
            hive_partitioning = true, union_by_name = true)
            {% endif %}
      - name: repo_metadata
        description: Daily cached GitHub repository metadata fetched by Dagster.
        meta:
          external_location: >-
            {% if target.name == 'prod' %}
            read_parquet('s3://{{ env_var("R2_BUCKET") }}/raw/repo_metadata/**/*.parquet',
            hive_partitioning = true, union_by_name = true)
            {% else %}
            read_parquet('{{ env_var("LAKE_ROOT", "data/lake") }}/raw/repo_metadata/**/*.parquet',
            hive_partitioning = true, union_by_name = true)
            {% endif %}
  - name: operations
    description: Dagster pipeline execution metrics stored in the DuckDB warehouse.
    schema: main
    tables:
      - name: pipeline_run_metrics
        description: One operational record per asset materialization in each Dagster run.
        columns:
          - name: run_id
            description: Dagster run identifier.
          - name: asset
            description: Dagster asset key.
          - name: partition
            description: Asset partition key, when the asset is partitioned.
          - name: status
            description: Final Dagster run status.
          - name: duration_seconds
            description: Elapsed asset step time in seconds.
          - name: rows_in
            description: Input rows observed by the ingestion asset.
          - name: rows_valid
            description: Valid rows written by the ingestion asset.
          - name: rows_quarantined
            description: Invalid rows quarantined by the ingestion asset.
          - name: recorded_at
            description: Timestamp when the run-status sensor recorded this metric.
          - name: error_summary
            description: Failure message, if the Dagster run failed.

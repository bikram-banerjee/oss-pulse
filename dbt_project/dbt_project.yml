name: oss_pulse
version: "1.0.0"
config-version: 2

profile: oss_pulse

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  breakout_min_stars: 10
  stars_reconcile_tolerance: 0

models:
  oss_pulse:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table

snapshots:
  oss_pulse:
    +target_schema: snapshots
